name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build and test (deny warnings) - ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable

      - name: Build all targets
        env:
          RUSTFLAGS: >-
            -D dead_code
            -D unused_imports
            -D unused_mut
            -D unused_variables
            -D unused_assignments
            -D unused_parens
            -W unreachable_pub
            -D unused_must_use
            -D unused_features
        run: cargo build --all-targets --all-features --locked

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Run tests (release) on macOS
        if: matrix.os == 'macos-latest'
        run: cargo test --all-targets --all-features --release --locked
